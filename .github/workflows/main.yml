name: "Dashmips Debugger"

on:
  push:
    branches:
      - master
      - "feature/**"
  pull_request:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'

      - run: npm install

      - name: Run headless test
        uses: GabrielBB/xvfb-action@v1.7
        with:
          run: npm test
